# RoyalBank - transaction history. The mask '0' slots are filled with your recent transactions
# (newest first); '1' slots are filler. See main.yml for the effect reference.
title: "&8Bank &7» &fTransactions"
rows: 6

sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2
  success:
    enabled: true
    name: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.8
    pitch: 1.4
  fail:
    enabled: true
    name: ENTITY_VILLAGER_NO
    volume: 0.7
    pitch: 1.0
  prompt:
    enabled: true
    name: BLOCK_NOTE_BLOCK_PLING
    volume: 0.7
    pitch: 1.5

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "100000001"
        - "100000001"
        - "100000001"
        - "100000001"
        - "111111111"

# One item per transaction in the '0' slots. items.<type> is picked by the transaction type (deposit,
# withdraw, interest, bonus, upgrade, transfer_in, transfer_out, coop_deposit, admin_set, ...); types
# not listed use items.default. A lore line with %note% is left out when the transaction has no note.
# Placeholders: %amount%, %balance_after%, %time% (time-format is a Java DateTimeFormatter pattern),
# %note%.
entry:
  time-format: "MM/dd HH:mm"
  items:
    deposit: lime_dye hide_attributes name:"&aDeposit"
    withdraw: red_dye hide_attributes name:"&cWithdraw"
    interest: clock hide_attributes name:"&bInterest"
    bonus: emerald hide_attributes name:"&aBonus"
    upgrade: gold_block hide_attributes name:"&eUpgrade"
    default: paper hide_attributes name:"&fTransaction"
  lore:
    - "&7Amount: &f%amount%"
    - "&7Balance After: &f%balance_after%"
    - "&7Time: &f%time%"
    - "&7Note: &f%note%"

slots:
  - item: arrow name:"&7« Back"
    lore:
      - "&7Return to the main bank menu."
    row: 6
    column: 4
    left-click:
      - id: open_menu
        args:
          menu: main

  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 6
    column: 6
    left-click:
      - id: close_inventory
